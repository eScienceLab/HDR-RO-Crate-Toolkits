[project]
name = "rocrate-toolkits"
version = "0.0.0"
description = "HDR RO-Crate Toolkits"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests==2.32.5",
    "python-dotenv==1.2.2",
    "five-safes-tes-workbench==1.1.1",
    "fivesafe_crate_py @ git+https://github.com/eScienceLab/5s-crate-py",
    # Imported directly to catch Workbench config and S3 errors; lower bounds
    # only, so they stay compatible with the versions Workbench requires.
    "pyyaml>=6.0.3",
    "botocore>=1.43.123",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
rocrate-tes-submit = "toolkits.scripts.rocrate_to_tes:main"
rocrate-tes-fetch = "toolkits.scripts.rocrate_save_tes:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
